name: Bug Report
description: Report an issue or bug with the Laravel transport
title: "[Bug]: "
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: |
              We're sorry to hear you have a problem. Can you help us solve it by providing the following details?

              **Do not report security vulnerabilities here** — see the security policy instead.
    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: What did you expect to happen?
          placeholder: I cannot currently do X thing because when I do, it breaks Y thing.
      validations:
          required: true
    - type: textarea
      id: how-to-reproduce
      attributes:
          label: How to reproduce the bug
          description: Provide a minimal code sample (a Mailable or `Mail::raw()` call) and a reliable set of steps if possible. Redact your API key.
          placeholder: With MAIL_MAILER=minimailer and X in config/minimailer.php, sending Y fails with Z.
      validations:
          required: true
    - type: input
      id: package-version
      attributes:
          label: Package Version
          description: Which version of `minimailer/laravel-minimailer` are you running? Please be as specific as possible.
          placeholder: 1.0.0
      validations:
          required: true
    - type: input
      id: laravel-version
      attributes:
          label: Laravel Version
          placeholder: 12.20.0
      validations:
          required: true
    - type: input
      id: php-version
      attributes:
          label: PHP Version
          placeholder: 8.3.14
      validations:
          required: true
    - type: dropdown
      id: queue
      attributes:
          label: How is the mail being sent?
          options:
              - Synchronously (Mail::send / Mail::raw)
              - Queued (ShouldQueue / Mail::queue)
              - Notification channel
              - Not sure
      validations:
          required: false
    - type: textarea
      id: notes
      attributes:
          label: Notes
          description: Any other detail you feel is relevant. Redact API keys, recipient addresses and message content.
      validations:
          required: false
