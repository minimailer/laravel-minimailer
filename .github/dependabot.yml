# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    # Same 7-day hold as config.policy.cooldown in composer.json, with the
    # same exemption for the package's own vendor namespace.
    cooldown:
      default-days: 7
      exclude:
        - "minimailer/*"
    labels:
      - "dependencies"
