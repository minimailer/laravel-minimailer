# managed-by: ComposerSecurityStamp (profile=oss) — edit the stamp, not this file
name: Composer Security

permissions:
  contents: read

on:
  push:
    paths:
      - 'composer.json'
      - '.github/workflows/composer-security.yml'
  pull_request:
  schedule:
    - cron: '27 6 * * 1'  # weekly — catches deps newly flagged in an unchanged lockfile

jobs:
  audit:
    name: Malware & advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The minimailer/minimailer-php SDK is a PRIVATE dependency consumed via a
      # local path repository, so `composer update` cannot resolve without it.
      # Same read-only deploy key as tests.yml. (Remove this step and the
      # `composer config` step below once both packages are public + on
      # Packagist — the file then matches the stamp's canonical body again.)
      - name: Checkout MiniMailer PHP SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: minimailer/minimailer-php
          ref: main
          path: minimailer-php
          ssh-key: ${{ secrets.MINIMAILER_SDK_SSH_KEY }}
          persist-credentials: false

      - name: Setup PHP + pinned Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:2.10
          coverage: none

      - name: Point the path repository at the checked-out SDK
        run: composer config repositories.minimailer-php '{"type":"path","url":"minimailer-php","options":{"symlink":false}}'

      - name: Resolve dependencies (library ships no lock)
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Audit (Composer >= 2.10 fails on malware + advisories)
        run: composer audit
