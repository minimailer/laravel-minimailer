name: quality

# CI check ONLY — fails if there are style violations, never mutates the codebase.
# Developers fix style locally (`vendor/bin/pint`) and push; CI just verifies. No
# workflow commits back to a branch. The Pint action bundles its own PHP and Pint,
# so this job runs no `composer install`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-code-styling:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    name: Pint

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check code style (fail on violations, no changes)
        uses: aglipanci/laravel-pint-action@36de00d5f5a8a4e12d443e01671daa12a18f4c79 # 2.6
        with:
          testMode: true
