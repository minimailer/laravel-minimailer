name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ['8.2', '8.3', '8.4', '8.5']
        dependency-version: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} - ${{ matrix.os }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The minimailer/minimailer-php SDK is a PRIVATE dependency consumed via a
      # local path repository. While it stays private, CI checks it out into the
      # workspace and repoints the named path repo at it. Auth is a read-only
      # deploy key registered on minimailer/minimailer-php, whose private half
      # is stored as the MINIMAILER_SDK_SSH_KEY secret — no expiry, unlike the
      # PAT it replaced. (Remove once both packages are public + on Packagist,
      # then delete the two SDK-checkout/config steps below.)
      - name: Checkout MiniMailer PHP SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: minimailer/minimailer-php
          ref: main
          path: minimailer-php
          ssh-key: ${{ secrets.MINIMAILER_SDK_SSH_KEY }}
          # The key is still used for the fetch itself; this only keeps it
          # out of the checked-out .git config afterwards.
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          # fileinfo is implicit on ubuntu/macos but not on windows, where
          # league/flysystem-local (via laravel/framework) fails to resolve
          # without it.
          extensions: json, mbstring, curl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Point the path repository at the checked-out SDK
        run: composer config repositories.minimailer-php '{"type":"path","url":"minimailer-php","options":{"symlink":false}}'

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: php vendor/bin/pest
