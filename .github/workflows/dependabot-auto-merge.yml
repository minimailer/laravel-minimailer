name: dependabot-auto-merge
on: pull_request_target

# pull_request_target runs with write permissions, but this workflow never
# checks out or executes PR code — it only reads metadata, waits on the PR's
# own check runs, and enables auto-merge.

# An explicit permissions block sets every unlisted scope to none. The wait
# steps list the PR's check runs, which needs checks: read (403 without it).
permissions:
  pull-requests: write
  contents: write
  checks: read

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # The wait steps block on the full OS x PHP test matrix, which can run
    # well past 5 minutes.
    timeout-minutes: 30
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # tests.yml is a 24-job matrix, so match by regexp instead of a single
      # check name. All matrix job names start with "PHP ".
      - name: Wait for the tests matrix to succeed
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-regexp: 'PHP .*'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

      - name: Wait for Pint to succeed
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: Pint
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

      # Composer updates must also clear the malware/advisory audit before they
      # are allowed to merge on their own.
      - name: Wait for the Composer security audit to succeed
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: Malware & advisory audit
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

      # Repository auto-merge is off and main has no required status checks,
      # so merge directly once every gate above has passed. --match-head-commit
      # refuses the merge if the PR head moved after the checks were read.
      # Squash keeps main's history linear under the branch ruleset.
      - name: Merge semver-minor and semver-patch updates
        if: ${{ contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.metadata.outputs.update-type) }}
        run: gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
